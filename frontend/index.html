<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><%= title %></title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      .app-loading {
        min-height: 100%;
        display: grid;
        place-items: center;
        color: #737373;
        background: #fff;
        font-size: 14px;
      }
      @media (prefers-color-scheme: dark) {
        .app-loading {
          color: #a3a3a3;
          background: #0b0b0b;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"
      ><div class="app-loading" role="status" aria-live="polite">불러오는 중...</div></div
    >
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
