# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: recon-server
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
    env:
      - GOAMD64=v1
    main: ./cmd/main
    binary: recon-server
    ldflags:
      - -s -w
      - -X recon/internal/constants.Version={{.Version}}

archives:
  - id: default
    builds:
      - recon-server
    format: zip
    name_template: "recon-server_{{ .Os }}_{{ .Arch }}"

changelog:
  disable: true

release:
  name_template: "Recon {{.Version}}"

dist: ./dist
